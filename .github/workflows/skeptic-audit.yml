name: Skeptic audit

on:
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run Skeptic against changed files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run audit:ci -- --diff origin/${{ github.base_ref }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skeptic-report
          path: |
            skeptic-report.json
            skeptic-report.md

      - name: Comment report on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: skeptic-report.md
